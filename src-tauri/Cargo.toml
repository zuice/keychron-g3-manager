[package]
name = "keychron-g3-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "keychron_g3_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
